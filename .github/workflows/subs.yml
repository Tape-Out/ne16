name: subs

on:
  schedule:
    # 半月一次：上游往前走了子模块不会自己跟，不跟不会报错，只会越来越旧
    - cron: "23 4 1,16 * *"
  workflow_dispatch:

jobs:
  subs:
    uses: Tape-Out/.github/.github/workflows/subs.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      # 这三个的版本由 NE16 自己的 Bender.yml 咬合：hwpe-stream 1.6.4 配
      # hci 1.0.6 配 hwpe-ctrl 1.6.2。跟到最新会少掉 hci 还在驱动的
      # test_mode_i，35 条展开错。钉死是设计，别让巡检每半月报一次红
      hold: third_party/hwpe-stream third_party/hwpe-ctrl third_party/hci
