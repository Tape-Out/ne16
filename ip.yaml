name: ne16
version: 0.1.0
spec: '0.1'
kind: ip
lang: sv
identity:
  slug: ne16-tapeout-foreign
  display_name: NE16
  summary: PULP's 16-channel neural engine, taken as a black box.
  category: accelerator
