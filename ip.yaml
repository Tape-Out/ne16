    BW: bw
    CNT: cnt
    ID: id
    MP: mp
    N_CONTEXT: nContext
    N_CORES: nCores
    TP_IN: tpIn
    TP_OUT: tpOut
  clock:
    port: clk_i
  reset:
    port: rst_ni
    active: low
    sync: true
  ports:
  - endpoint: periph
    kind: transaction
    role: target
    profile: hwpe-periph
    prefix: periph_
  - endpoint: tcdm
    kind: transaction
    role: manager
    profile: hci-tcdm
    prefix: tcdm_
  - endpoint: evt
    kind: event
    role: source
    map:
      evt: evt_o
  - endpoint: pins
    kind: physical
    type: Ne16Pins
    map:
      busy: busy_o
      testMode: test_mode_i
  limits:
  - 控制口是 HWPE 的外设协议、存储口是 HCI 的 TCDM，两者都不是 AXI；要挂总线得在外面加桥
  - 依赖四个兄弟仓，版本按 ne16 的 Bender.yml 钉死：hwpe-stream 1.6.4、hwpe-ctrl 1.6.2、hci 1.0.6；取新的会对不上端口
  - 工艺单元只取通用那一支：src/fpga 里的 Xilinx 原语（BUFGCE）不进这条路
  - 上游不带可跑的测试台，这一版只有逐点展开与声明回执
test:
  noarea:
  - bw
  - cnt
  - id
  - mp
  - nContext
  - nCores
  - tpIn
  - tpOut
targets:
  foreign:
    driver: foreign
