    type: choice
    values:
    - 288
    - 576
    default: 288
  cnt:
    type: choice
    values:
    - 8
    - 16
    - 32
    default: 16
  id:
    type: choice
    values:
    - 8
    - 16
    - 32
    default: 16
  mp:
    type: choice
    values:
    - 4
    - 9
    default: 9
  nContext:
    type: choice
    values:
    - 1
    - 2
    - 4
    default: 1
  nCores:
    type: choice
    values:
    - 4
    - 8
    - 9
    - 16
    default: 9
  tpIn:
    type: choice
    values:
    - 8
    - 16
    - 32
    default: 16
  tpOut:
    type: choice
    values:
    - 16
    - 32
    - 64
    default: 32
